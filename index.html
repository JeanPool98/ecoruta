{id:"mva",n:"Área mitral por PHT",d:"Estenosis mitral.",f:[["pht","Tiempo de hemipresión (ms)",200]],
 run:v=>{const a=220/v.pht; return R("AVM",fmt(a,2)+" cm²")+`<div>${a<=1?chip("Muy severa","c-red"):a<=1.5?chip("Severa / significativa","c-amber"):chip("No significativa","c-done")}</div><p class="muted">No válido justo tras valvuloplastia, con IA severa o con VI muy rígido.</p>`;}},
{id:"pros",n:"Prótesis aórtica",d:"Obstrucción frente a desproporción (ASE 2009).",f:[["vmax","Vmax prótesis (m/s)",3.4],["gm","Gradiente medio (mmHg)",28],["vti1","ITV TSVI (cm)",22],["vti2","ITV prótesis (cm)",60],["at","Tiempo de aceleración (ms)",75],["d","Diámetro TSVI (cm)",2.1],["bsa","Superficie corporal (m²)",1.9],["imc","IMC (kg/m²)",26]],
 run:v=>{const dvi=v.vti1/v.vti2, eoa=Math.PI*(v.d/2)**2*v.vti1/v.vti2, eoai=eoa/v.bsa; const ob=v.imc>=30;
  const ppm=eoai>(ob?0.70:0.85)?chip("Sin desproporción","c-done"):eoai>=(ob?0.55:0.65)?chip("Desproporción moderada","c-amber"):chip("Desproporción severa","c-red");
  let inter; if(dvi<0.25&&v.at>100) inter=chip("Sugiere obstrucción protésica","c-red"); else if(v.gm>=20&&dvi>=0.30&&v.at<80) inter=chip("Gradiente alto con DVI y TA normales: alto flujo o desproporción","c-amber"); else if(v.gm<20&&dvi>=0.30) inter=chip("Hemodinámica normal","c-done"); else inter=chip("Zona intermedia: compara con el basal","c-amber");
  return R("DVI",fmt(dvi,2))+R("EOA",fmt(eoa,2)+" cm²")+R("EOA indexada",fmt(eoai,2)+" cm²/m²")+`<div style="display:flex;gap:6px;flex-wrap:wrap">${inter}${ppm}</div>`;}},
{id:"qpqs",n:"Qp/Qs",d:"Magnitud de un shunt.",f:[["dr","Diámetro TSVD (cm)",2.6],["vr","ITV TSVD (cm)",24],["dl","Diámetro TSVI (cm)",2.0],["vl","ITV TSVI (cm)",20]],
 run:v=>{const qp=Math.PI*(v.dr/2)**2*v.vr, qs=Math.PI*(v.dl/2)**2*v.vl, r=qp/qs;
  return R("Qp",fmt(qp,0)+" mL")+R("Qs",fmt(qs,0)+" mL")+R("Qp/Qs",fmt(r,2))+`<div>${r>1.5?chip("Shunt izquierda-derecha significativo","c-red"):r<1?chip("Qp < Qs: revisa medidas o shunt derecha-izquierda","c-amber"):chip("No significativo","c-done")}</div>`;}}
];
function renderCalc(){
  const c=CALCS.find(x=>x.id===calcSel);
  const nav=CALCS.map(x=>`<button data-c="${x.id}" aria-pressed="${x.id===calcSel}">${esc(x.n)}</button>`).join("");
  const fields=c.f.map(([id,l,def])=>`<label for="cf-${c.id}-${id}">${esc(l)}<input type="number" step="any" inputmode="decimal" id="cf-${c.id}-${id}" data-k="${id}" value="${def}"></label>`).join("");
  app.innerHTML=`<section class="view"><div><span class="eyebrow">Calculadoras</span><h2>Fórmulas con interpretación</h2><p class="muted">Los valores precargados son un ejemplo. Cámbialos por los de tu paciente.</p></div>
    <div class="calcnav">${nav}</div>
    <article class="calc"><h3>${esc(c.n)}</h3><p class="muted">${esc(c.d)}</p><div class="fields">${fields}</div><div class="res" id="cres"></div></article></section>`;
  const upd=()=>{const v={}; app.querySelectorAll("[data-k]").forEach(i=>v[i.dataset.k]=parseFloat(i.value)); $("#cres").innerHTML=Object.values(v).some(x=>!Number.isFinite(x))?'<p class="muted">Completa todos los campos.</p>':c.run(v);};
  app.querySelectorAll("[data-k]").forEach(i=>i.addEventListener("input",upd)); upd();
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{calcSel=b.dataset.c;render();});
}

/* ---------- Tarjetas (Leitner) ---------- */
const INT=[0,1,3,7,16,35].map(d=>d*864e5);
const inTag=i=>cardTag==="all"||ALLCARDS[i][0]===cardTag;
function dueList(){const now=Date.now();return ALLCARDS.map((c,i)=>i).filter(i=>inTag(i)&&((S.cards[i]||{}).due||0)<=now).sort((a,b)=>((S.cards[a]||{}).due||0)-((S.cards[b]||{}).due||0)||a-b);}
function renderCards(){
  const due=dueList(); const counts=[0,0,0,0,0,0]; let total=0; ALLCARDS.forEach((c,i)=>{if(inTag(i)){counts[(S.cards[i]||{}).b||0]++;total++;}});
  const boxes=[1,2,3,4,5].map(b=>`<div><b>${counts[b]}</b>Caja ${b}</div>`).join("");
  const tags=`<div class="calcnav"><button data-tag="all" aria-pressed="${cardTag==="all"}">Todas</button>${Object.entries(TAG_NAMES).map(([k,n])=>`<button data-tag="${k}" aria-pressed="${cardTag===k}">${n}</button>`).join("")}</div>`;
  let card;
  if(!due.length){ const nx=ALLCARDS.map((c,i)=>i).filter(inTag).map(i=>(S.cards[i]||{}).due||Infinity); const next=Math.min(...nx); card=`<div class="card"><div class="front">Terminaste las tarjetas de hoy${cardTag==="all"?"":" de este tema"}.</div><p class="muted">La próxima vuelve ${Number.isFinite(next)?new Date(next).toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"}):"pronto"}.</p></div>`; }
  else{ const i=due[0]; const [tg,f,b]=ALLCARDS[i]; const st=S.cards[i]||{b:0};
    card=`<div class="card"><span class="eyebrow">${TAG_NAMES[tg]} · ${st.b?"Caja "+st.b:"Nueva"}</span><div class="front">${esc(f)}</div>
    ${cardFlip?`<div class="backtxt">${esc(b)}</div><div class="grade"><button class="btn g-again" data-g="0">No la sabía</button><button class="btn g-good" data-g="1">La sabía</button><button class="btn g-easy" data-g="2">Fácil</button></div>`:`<button class="btn primary" id="flip" style="justify-self:start">Mostrar respuesta</button>`}</div>`; }
  app.innerHTML=`<section class="view"><div><span class="eyebrow">Tarjetas</span><h2>Repaso espaciado</h2><p class="muted">Las que fallas vuelven hoy; las que sabes se espacian 1, 3, 7, 16 y 35 días.</p></div>
    ${tags}<div class="deckstats">${chip(due.length+" pendientes hoy","c-open")}${chip(counts[0]+" sin ver","c-lock")}${chip(total+" en este mazo","c-lock")}</div>
    <div class="boxes">${boxes}</div>${card}</section>`;
  app.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{cardTag=b.dataset.tag;cardFlip=false;render();});
  const fl=$("#flip"); if(fl) fl.onclick=()=>{cardFlip=true;render();};
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const i=due[0]; const st=S.cards[i]||{b:0}; const g=+b.dataset.g;
    const nb= g===0?1 : Math.min(5,(st.b||0)+g); const d= g===0? Date.now() : Date.now()+INT[nb];
    S.cards[i]={b:nb,due:d,t:Date.now()}; cardFlip=false; save(); render();});
}

/* ---------- Casos ---------- */
function renderCasos(){
  const ok=Object.values(S.cases).filter(x=>x.ok).length;
  const list=CASES.map(c=>{const st=S.cases[c.id];
    const opts=c.o.map((o,i)=>{let cls="opt"; if(st){ if(i===c.a) cls+=" ok"; else if(i===st.pick) cls+=" bad"; }
      return `<button class="${cls}" data-case="${c.id}" data-i="${i}" ${st?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;}).join("");
    return `<article class="case"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>${esc(c.t)}</h3>${st?chip(st.ok?"Correcto":"Revisar",st.ok?"c-done":"c-red"):""}</div>
      <div class="vitals">${c.v.map(x=>`<span>${esc(x)}</span>`).join("")}</div><p>${esc(c.s)}</p><h4>${esc(c.q)}</h4><div class="opts">${opts}</div>
      ${st?`<div class="expl">${esc(c.e)}</div><button class="toggle" data-reset="${c.id}">Volver a intentar</button>`:""}</article>`;}).join("");
  app.innerHTML=`<section class="view"><div><span class="eyebrow">Casos clínicos</span><h2>Integra lo aprendido</h2><p class="muted">${ok} de ${CASES.length} resueltos correctamente.</p></div>${list}</section>`;
  app.querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>{const c=CASES.find(x=>x.id===b.dataset.case); const i=+b.dataset.i; S.cases[c.id]={pick:i,ok:i===c.a,t:Date.now()}; save(); render();});
  app.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{delete S.cases[b.dataset.reset]; save(false); render();});
}

/* ---------- Examen ---------- */
function renderExam(){
  const pool=MODULES.flatMap(m=>m.quiz.map(q=>Object.assign({mt:m.title},q)));
  if(!exam){
    const hist=S.exams.slice(-8).reverse().map(e=>`<tr><td>${new Date(e.d).toLocaleDateString("es",{day:"numeric",month:"short"})}</td><td class="num">${e.s}/${e.n}</td><td class="num">${Math.round(e.s/e.n*100)} %</td></tr>`).join("");
    app.innerHTML=`<section class="view"><div><span class="eyebrow">Examen</span><h2>Simulacro mixto</h2><p class="muted">Preguntas al azar de los ${MODULES.length} módulos (banco de ${pool.length}). Ves la corrección al final.</p></div>
      <div class="calcnav"><button data-n="10">10 preguntas</button><button data-n="20">20 preguntas</button><button data-n="40">40 preguntas</button></div>
      ${hist?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Aciertos</th><th>%</th></tr></thead><tbody>${hist}</tbody></table></div>`:'<p class="muted">Aún no has hecho ningún simulacro.</p>'}</section>`;
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{exam={qs:shuffle(pool).slice(0,+b.dataset.n),i:0,picks:[],done:false};render();});
    return;
  }
  if(exam.done){
    const s=exam.picks.filter((p,i)=>p===exam.qs[i].a).length;
    const wrong=exam.qs.map((q,i)=>[q,exam.picks[i]]).filter(([q,p])=>p!==q.a);
    app.innerHTML=`<section class="view"><div><span class="eyebrow">Resultado</span><div class="score">${s}/${exam.qs.length}</div><p class="muted">${Math.round(s/exam.qs.length*100)} % de aciertos.</p></div>
      ${wrong.length?`<h3>Para repasar</h3>`+wrong.map(([q,p])=>`<article class="case"><span class="eyebrow">${esc(q.mt)}</span><h4>${esc(q.q)}</h4><p>Tu respuesta: <span class="red">${esc(q.o[p])}</span></p><p>Correcta: <b>${esc(q.o[q.a])}</b></p><p class="muted">${esc(q.e)}</p></article>`).join(""):"<p>Sin errores.</p>"}
      <div class="nav2"><span></span><button class="btn primary" id="exback">Nuevo simulacro</button></div></section>`;
    $("#exback").onclick=()=>{exam=null;render();};
    return;
  }
  const q=exam.qs[exam.i];
  app.innerHTML=`<section class="view"><div class="meter"><i style="width:${exam.i/exam.qs.length*100}%"></i></div>
    <article class="lesson q">${qHTML(q,null,"Pregunta "+(exam.i+1)+" de "+exam.qs.length+" · "+esc(q.mt))}</article>
    <button class="toggle" id="exquit">Abandonar</button></section>`;
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{exam.picks.push(+b.dataset.opt); exam.i++;
    if(exam.i>=exam.qs.length){exam.done=true; const s=exam.picks.filter((p,i)=>p===exam.qs[i].a).length; S.exams.push({d:Date.now(),s,n:exam.qs.length}); save();}
    render(); window.scrollTo({top:0});});
  $("#exquit").onclick=()=>{exam=null;render();};
}

/* ---------- Valores normales ---------- */
function renderNorm(){
  app.innerHTML=`<section class="view"><div><span class="eyebrow">Referencia</span><h2>Valores normales y cortes</h2></div>
    <div class="fields" style="max-width:420px"><label for="nq">Buscar<input type="search" id="nq" value="${esc(normQ)}" placeholder="TAPSE, e', aorta…" style="font-family:var(--f-body)"></label></div>
    <div class="tbl"><table><thead><tr><th>Área</th><th>Parámetro</th><th>Valor</th><th>Fuente</th></tr></thead><tbody id="nbody"></tbody></table></div>
    <p class="muted" style="font-size:.85rem">Valores de adultos. Ante discrepancias, manda la guía vigente de tu laboratorio.</p></section>`;
  const fill=()=>{const q=normQ.toLowerCase(); $("#nbody").innerHTML=NORMALS.filter(r=>!q||r.join(" ").toLowerCase().includes(q)).map(r=>`<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td class="num">${esc(r[2])}</td><td class="muted">${esc(r[3])}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Sin resultados.</td></tr>';};
  $("#nq").addEventListener("input",e=>{normQ=e.target.value;fill();}); fill();
}

/* ---------- Render ---------- */
app.addEventListener("click",e=>{const t=e.target.closest("[data-tgl]"); if(!t) return; const box=document.getElementById(t.dataset.tgl); const orig=t.dataset.orig||(t.dataset.orig=t.textContent); const off=box.classList.toggle("lbl-off"); t.textContent=off?"Mostrar etiquetas":orig;});
function render(){
  setTab(view);
  if(view==="ruta") renderRuta();
  else if(view.startsWith("mod:")) renderMod();
  else if(view==="atlas") renderAtlas();
  else if(view==="sim") renderSim();
  else if(view==="calc") renderCalc();
  else if(view==="cards") renderCards();
  else if(view==="casos") renderCasos();
  else if(view==="exam") renderExam();
  else if(view==="norm") renderNorm();
  else if(view==="cuenta"&&window.Cloud) Cloud.render(app);
  mountWidgets(app);
}
window.ECO={get:()=>S,set:x=>{S=Object.assign(blank(),x);try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} render();},go:v=>{view=v;render();window.scrollTo({top:0});}};
render();
if(window.Cloud) Cloud.start();

</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}</script></body></html>
