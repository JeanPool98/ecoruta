<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1016">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EcoRuta"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>EcoRuta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: app de estudio con pestañas arriba; una columna de contenido (~760px) y paneles tipo "pantalla de eco" para las imágenes. */
:root{
  --bg:#F3F5F8; --on-blue:#FFFFFF; --panel:#FFFFFF; --ink:#101826; --muted:#586273; --line:#DCE2EA; --soft:#EBEFF4;
  --red:#C9372C; --blue:#1E5BC6; --amber:#A86C12; --green:#1C7F4E;
  --t-red:#FBEBE9; --t-blue:#E8F0FC; --t-amber:#FAF0DF; --t-green:#E3F4EA;
  --screen:#0B1016; --liver:#B98E7A; --cav:#9E3B3B; --myo:#EFA9A9; --fan:#B3B9C1; --fan-line:#7C8591; --svg-ink:#101826; --svg-halo:#FFFFFF;
  --f-disp:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1016; --on-blue:#0B1016; --panel:#131A23; --ink:#E6ECF3; --muted:#97A3B4; --line:#243040; --soft:#1A2330;
  --red:#F06B5F; --blue:#71A8FF; --amber:#E6AF59; --green:#59C88E;
  --t-red:#2D1816; --t-blue:#132341; --t-amber:#2E2412; --t-green:#12291D;
  --screen:#05080B; --liver:#6E5246; --cav:#8C3535; --myo:#D49393; --fan:#3B4552; --fan-line:#5B6675; --svg-ink:#E6ECF3; --svg-halo:#131A23; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1016; --on-blue:#0B1016; --panel:#131A23; --ink:#E6ECF3; --muted:#97A3B4; --line:#243040; --soft:#1A2330;
  --red:#F06B5F; --blue:#71A8FF; --amber:#E6AF59; --green:#59C88E;
  --t-red:#2D1816; --t-blue:#132341; --t-amber:#2E2412; --t-green:#12291D;
  --screen:#05080B; --liver:#6E5246; --cav:#8C3535; --myo:#D49393; --fan:#3B4552; --fan-line:#5B6675; --svg-ink:#E6ECF3; --svg-halo:#131A23; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;margin:0}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.inner{max-width:820px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1.02rem;font-weight:700}
p{margin:0}
.flow>*+*{margin-top:.75rem}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Barra superior */
header.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.bar .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.brand svg{width:34px;height:22px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:.93rem;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink);font-weight:700}
.tabs button:hover{color:var(--ink)}
.sync{font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}

main{padding-block:28px 80px}
.view{display:grid;gap:22px}

/* Ruta */
.overall{display:grid;gap:8px}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.path li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:14px}
.path li:not(:last-child)::after{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;border:2px solid var(--line);background:var(--panel);color:var(--muted);z-index:1}
.st-done .node{background:var(--green);border-color:var(--green);color:var(--panel)}
.st-open .node{border-color:var(--blue);color:var(--blue)}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;text-align:left;width:100%;min-width:0}
.mcard:hover:not([disabled]){border-color:var(--blue)}
.mcard[disabled]{opacity:.55;cursor:not-allowed}
.mcard .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.c-done{background:var(--t-green);color:var(--green)}
.c-open{background:var(--t-blue);color:var(--blue)}
.c-lock{background:var(--soft);color:var(--muted)}
.c-red{background:var(--t-red);color:var(--red)}
.c-amber{background:var(--t-amber);color:var(--amber)}
.freebox{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}

/* Módulo */
.back{border:0;background:none;color:var(--blue);padding:0;font-size:.92rem;justify-self:start}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:.82rem;font-family:var(--f-mono)}
.steps button[aria-current="step"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.steps button.seen{border-color:var(--green)}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
.lesson .flow{max-width:68ch}
.lesson ul{margin:0;padding-left:1.2rem;display:grid;gap:4px}
.callout{border-left:4px solid var(--blue);background:var(--t-blue);padding:12px 14px;border-radius:0 8px 8px 0}
.callout.red{border-color:var(--red);background:var(--t-red)}
.callout.amber{border-color:var(--amber);background:var(--t-amber)}
.formula{font-family:var(--f-mono);font-size:1.02rem;background:var(--soft);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}

figure{margin:0;display:grid;gap:6px}
figure img{display:block;width:100%;height:auto;border-radius:8px}
figcaption{font-size:.85rem;color:var(--muted)}
.screen{background:var(--screen);border-radius:10px;padding:8px}
.paper{background:#fff;border-radius:10px;padding:6px;border:1px solid var(--line)}
.hot{position:relative}
.hot .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--panel);font-family:var(--f-mono);font-size:.75rem;font-weight:600;display:grid;place-items:center;border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.legend{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px;font-size:.92rem}
.legend li{display:flex;gap:8px;align-items:baseline}
.legend b{font-family:var(--f-mono);font-size:.8rem;min-width:1.4rem}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;transform:translateY(1px)}
.svgbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;min-width:300px}
.s-fan{fill:var(--fan);stroke:var(--fan-line);stroke-width:1.5}
.s-myo{fill:var(--myo);stroke:var(--cav);stroke-width:1.2}
.s-cav{fill:var(--cav)}
.s-valve{stroke:var(--myo);stroke-width:4;stroke-linecap:round;fill:none}
.s-lbl{font-family:var(--f-body);font-size:13px;font-weight:700;fill:var(--svg-ink);paint-order:stroke;stroke:var(--svg-halo);stroke-width:4px;stroke-linejoin:round}
.s-seg{font-family:var(--f-mono);font-size:10.5px;fill:var(--svg-ink);paint-order:stroke;stroke:var(--svg-halo);stroke-width:3px}
.s-line{stroke:var(--svg-ink);stroke-width:1;fill:none;opacity:.6}
.lbl-off .s-lbl,.lbl-off .s-seg,.lbl-off .s-line{display:none}
.toggle{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:.85rem;justify-self:start}

/* Quiz */
.q{display:grid;gap:10px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;text-align:left;display:grid;grid-template-columns:1.6rem 1fr;gap:8px}
.opt .k{font-family:var(--f-mono);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--t-green)}
.opt.bad{border-color:var(--red);background:var(--t-red)}
.opt[disabled]{cursor:default}
.expl{border-top:1px dashed var(--line);padding-top:10px}
.score{font-family:var(--f-disp);font-size:2.4rem;font-weight:700}

/* Atlas */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.agrid button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.agrid button[aria-pressed="true"]{border-color:var(--blue);background:var(--t-blue)}
.agrid small{color:var(--muted);font-size:.78rem}
dl.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:8px 16px;margin:0}
dl.kv dt{font-weight:700;color:var(--muted);font-size:.9rem}
dl.kv dd{margin:0;min-width:0}
@media (max-width:560px){dl.kv{grid-template-columns:1fr}dl.kv dd{margin-bottom:6px}}

/* Calculadoras */
.calcs{display:grid;gap:16px}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fields label{display:grid;gap:3px;font-size:.85rem;color:var(--muted);min-width:0}
.fields input,.fields select{font:inherit;font-family:var(--f-mono);font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.fields .chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:.9rem}
.fields .chk input{width:auto}
.res{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.res .big{font-family:var(--f-mono);font-size:1.45rem;font-weight:600}
.res .lab{font-size:.82rem;color:var(--muted)}
.calcnav{display:flex;flex-wrap:wrap;gap:6px}
.calcnav button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.85rem}
.calcnav button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* Tarjetas */
.deckstats{display:flex;flex-wrap:wrap;gap:8px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.boxes div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:.78rem;color:var(--muted)}
.boxes b{display:block;font-family:var(--f-mono);font-size:1.2rem;color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;min-height:220px;display:grid;gap:14px;align-content:start}
.card .front{font-family:var(--f-disp);font-size:1.35rem;font-weight:700;line-height:1.3}
.card .backtxt{border-top:1px solid var(--line);padding-top:14px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{padding:10px 8px}
.g-again{border-color:var(--red)!important;color:var(--red)}
.g-good{border-color:var(--blue)!important;color:var(--blue)}
.g-easy{border-color:var(--green)!important;color:var(--green)}

/* Casos */
.case{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.vitals{display:flex;flex-wrap:wrap;gap:6px}
.vitals span{font-family:var(--f-mono);font-size:.8rem;background:var(--soft);border-radius:6px;padding:2px 8px}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px}

/* v2 */
.paper.gem{display:grid;place-items:center}
.paper.gem img{max-height:420px;width:auto;max-width:100%}
@media (max-width:1150px){header.bar .sync{display:none}}
.syncline{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.s-liver{fill:var(--liver);opacity:.85}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.stats b{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
button.pin{padding:0;cursor:pointer}
.pin-ok{background:var(--green)!important}
.pin-bad{background:var(--red)!important}
.wbox{display:grid;gap:12px}
.w-vessel{fill:var(--t-red);stroke:var(--red);stroke-width:1.5}
.w-flow{stroke:var(--red);stroke-width:3;fill:none}
.w-arrowhead{fill:var(--red)}
.w-beam{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:7 5}
.w-probe{fill:var(--ink)}
.w-arc{fill:none;stroke:var(--amber);stroke-width:2}
.bwrap{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:16px;align-items:start}
.bwrap>*{min-width:0}
@media (max-width:620px){.bwrap{grid-template-columns:1fr}}
.bull{width:100%;height:auto;display:block}
.bseg{fill:var(--soft);stroke:var(--panel);stroke-width:2;cursor:pointer;transition:fill .15s}
.bseg:hover{fill:var(--t-blue)}
.bseg.t-da{fill:var(--t-blue)} .bseg.t-cd{fill:var(--t-red)} .bseg.t-cx{fill:var(--t-green)}
.bseg.sel{stroke:var(--ink);stroke-width:3}
.bnum{font-family:var(--f-mono);font-size:12px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.binfo{background:var(--soft);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.blegend{display:flex;gap:14px;font-size:.85rem;color:var(--muted)}
.blegend .dot{margin-right:5px}
.dot.t-da{background:var(--t-blue);border:2px solid var(--blue)} .dot.t-cd{background:var(--t-red);border:2px solid var(--red)} .dot.t-cx{background:var(--t-green);border:2px solid var(--green)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tbl table,table.mini{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl table{min-width:520px}
.tbl th,.tbl td,table.mini th,table.mini td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th,table.mini th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl tr:last-child td,table.mini tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lesson .flow:has(table.mini){max-width:none;overflow-x:auto}
table.mini{min-width:460px}
span.red{color:var(--red)}

/* v4 inicio más claro */
.eyebrow{font-family:var(--f-body);font-size:.8rem;letter-spacing:.02em;text-transform:none;font-weight:700;color:var(--blue)}
.mono,.readout,.res .big,.boxes b,.score,td.num{font-variant-numeric:tabular-nums}
.res .big,.boxes b,.stats b{font-family:var(--f-disp)}
.steps button{font-family:var(--f-body)}
header.bar .sync{display:none!important}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:10px}
.hero h2{font-size:1.7rem}
.hero p{font-size:1.05rem}
.heroact{display:flex;flex-wrap:wrap;gap:10px;margin-block:6px}
.btn.big{padding:12px 20px;font-size:1.02rem}
.small{font-size:.86rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.how div{display:grid;grid-template-columns:2rem 1fr;gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.how b{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--t-blue);color:var(--blue);font-family:var(--f-mono)}
h3.sec{font-size:1.1rem;margin-top:8px}
.stats b{font-family:var(--f-disp);font-size:1.25rem}
.stats span{font-size:.85rem;line-height:1.35}
.mcard[disabled]{opacity:1}
.st-lock .mcard h3{color:var(--muted)}
.st-lock .mcard{background:transparent}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sgrid button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;text-align:left;display:grid;gap:3px}
.sgrid button:hover{border-color:var(--blue)}
.sgrid span{font-size:.86rem;color:var(--muted);line-height:1.4}
.cloudbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar gut">
  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 34 22" aria-hidden="true"><path d="M17 1 L33 21 L1 21 Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 15 L11 15 L13 10 L16 19 L19 6 L22 15 L28 15" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round"/></svg>
      EcoRuta
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" id="t-ruta" aria-selected="true" data-v="ruta">Ruta</button>
      <button role="tab" id="t-atlas" aria-selected="false" data-v="atlas">Atlas</button>
      <button role="tab" id="t-sim" aria-selected="false" data-v="sim">Simuladores</button>
      <button role="tab" id="t-calc" aria-selected="false" data-v="calc">Calculadoras</button>
      <button role="tab" id="t-cards" aria-selected="false" data-v="cards">Tarjetas</button>
      <button role="tab" id="t-casos" aria-selected="false" data-v="casos">Casos</button>
      <button role="tab" id="t-exam" aria-selected="false" data-v="exam">Examen</button>
      <button role="tab" id="t-norm" aria-selected="false" data-v="norm">Valores normales</button>
      <button role="tab" id="t-cuenta" aria-selected="false" data-v="cuenta">Cuenta</button>
    </nav>
    <span class="sync" id="sync">guardado local</span>
  </div>
</header>

{id:"m1",title:"Física y botones",sub:"Lo mínimo para entender qué ves y por qué el Doppler funciona",
lessons:[
{t:"Frecuencia, resolución y penetración",h:`<div class="flow">
<p>El transductor emite pulsos de ultrasonido y escucha los ecos. Dos ideas lo explican casi todo:</p>
<ul><li><b>Más frecuencia</b> → mejor resolución axial, menos penetración. Por eso el eco transesofágico (5–7 MHz) ve más fino que el transtorácico del adulto (2–4 MHz).</li>
<li><b>Resolución axial</b> (a lo largo del haz) siempre es mejor que la <b>lateral</b>. Mide estructuras finas (septo, VC, TSVI) con el haz perpendicular a ellas.</li></ul>
<p>Botones que más cambian la imagen: <b>profundidad</b> (lo justo para ver la estructura; más profundidad baja el frame rate), <b>ganancia</b> y <b>TGC</b> (compensan la atenuación por profundidad), <b>foco</b> (a la altura de lo que quieres medir) y <b>ancho del sector</b> (más estrecho = más frame rate).</p></div>
<div class="callout">Regla práctica: antes de medir, zoom y sector estrecho. Ganas resolución temporal y espacial a la vez.</div>`},
{t:"El efecto Doppler",h:`<figure><div class="paper"><img src="${IMG.doppler}" alt="Ilustración: transductor sobre un vaso; glóbulos rojos que se acercan devuelven ondas más juntas (rojo) y los que se alejan, más separadas (azul)"></div>
<figcaption>Esquema conceptual generado con Gemini: los glóbulos que se acercan comprimen el eco reflejado (frecuencia mayor, rojo); los que se alejan lo estiran (frecuencia menor, azul).</figcaption></figure>
<div class="flow"><p>La sangre en movimiento cambia la frecuencia del eco. Ese cambio (Δf) es proporcional a la velocidad:</p>
<div class="formula">Δf = 2 · f₀ · v · cos θ / c</div>
<p>El término importante es <b>cos θ</b>: el ángulo entre el haz y el flujo. Con θ &lt; 20° el error es &lt; 6 %. A 60° mides solo la mitad de la velocidad real. El Doppler <b>siempre subestima</b> si no estás alineado, nunca sobreestima.</p>
<p>Convención de color <b>BART</b>: <b>B</b>lue <b>A</b>way, <b>R</b>ed <b>T</b>oward (azul se aleja del transductor, rojo se acerca).</p></div>`},
{t:"PW, CW, color y aliasing",h:`<div class="flow">
<ul><li><b>Doppler pulsado (PW):</b> mide en un punto (volumen de muestra). Sirve para TSVI, flujo mitral, venas pulmonares, Doppler tisular. Límite: <b>aliasing</b> cuando la velocidad supera el límite de Nyquist.</li>
<li><b>Límite de Nyquist = PRF / 2.</b> Más profundidad → PRF menor → aliasing más fácil.</li>
<li><b>Doppler continuo (CW):</b> mide todas las velocidades a lo largo del haz, sin límite. Úsalo para chorros rápidos (EA, IT, IM). No sabe a qué profundidad está la velocidad máxima.</li>
<li><b>Color:</b> es PW en muchos puntos. El aliasing del color no es un error: es lo que usa el método PISA.</li></ul></div>
<div class="callout amber">Si en PW la curva se "corta" y reaparece del otro lado de la línea de base, es aliasing. Baja la línea de base, sube la escala o pasa a CW.</div>`},
{t:"Bernoulli: de velocidad a presión",h:`<div class="flow"><p>La ecuación de Bernoulli simplificada convierte la velocidad máxima de un chorro en gradiente de presión:</p>
<div class="formula">ΔP (mmHg) = 4 · v² (v en m/s)</div>
<p>Ejemplos que vas a usar todos los días:</p>
<ul><li>IT a 3 m/s → 4 × 9 = 36 mmHg entre VD y AD. Sumas la presión de AD y tienes la PSAP.</li>
<li>EA con Vmax 4 m/s → gradiente pico 64 mmHg (umbral de EA severa).</li></ul>
<p>Asume que la velocidad proximal es despreciable. Si la velocidad en el TSVI es &gt; 1,5 m/s, usa la forma completa: ΔP = 4 (v₂² − v₁²).</p></div>`}
],

{id:"m2",title:"Ventanas y vistas",sub:"Dónde poner el transductor y qué debe aparecer en pantalla",
lessons:[
{t:"Las cuatro ventanas",h:`<figure><div class="paper"><img src="${IMG.ventanas}" alt="Torso con cuatro posiciones del transductor marcadas en colores"></div>
<figcaption>Ilustración generada con Gemini.</figcaption></figure>
<ul class="legend">
<li><span class="dot" style="background:#E7C33A"></span><span>Supraesternal: escotadura yugular, cuello extendido.</span></li>
<li><span class="dot" style="background:#E05A5A"></span><span>Paraesternal izquierda: 3.º–4.º EIC junto al esternón, decúbito lateral izquierdo.</span></li>
<li><span class="dot" style="background:#4D97D9"></span><span>Apical: donde palpas el choque de punta, habitualmente 5.º EIC, línea medioclavicular o algo lateral.</span></li>
<li><span class="dot" style="background:#5AAF6A"></span><span>Subcostal: bajo el xifoides, rodillas flexionadas, inspiración.</span></li></ul>
<div class="callout">El decúbito lateral izquierdo acerca el corazón a la pared y mejora las ventanas paraesternal y apical. La subcostal se hace en decúbito supino.</div>`},
{t:"Paraesternal eje largo (PLAX)",h:`<figure><div class="paper hot" id="plaxhot"><img src="${IMG.plax}" alt="Corte esquemático en eje largo paraesternal">
<span class="pin" style="left:46%;top:30%">1</span><span class="pin" style="left:42%;top:41%">2</span><span class="pin" style="left:37%;top:60%">3</span><span class="pin" style="left:61%;top:36%">4</span><span class="pin" style="left:57.4%;top:49%">5</span><span class="pin" style="left:53%;top:63%">6</span><span class="pin" style="left:65%;top:67%">7</span><span class="pin" style="left:42%;top:83%">8</span><span class="pin" style="left:70%;top:79%">9</span></div>
<figcaption>Base generada con Gemini, numeración añadida. La orientación es la de la pantalla: ápex a la izquierda, aorta a la derecha.</figcaption></figure>
<ul class="legend"><li><b>1</b>Tracto de salida del VD</li><li><b>2</b>Septo interventricular</li><li><b>3</b>Cavidad del VI</li><li><b>4</b>Raíz aórtica</li><li><b>5</b>Válvula aórtica (cúspides coronaria derecha y no coronaria)</li><li><b>6</b>Válvula mitral (velo anterior en continuidad con la aorta)</li><li><b>7</b>Aurícula izquierda</li><li><b>8</b>Pared inferolateral del VI</li><li><b>9</b>Aorta descendente (referencia para separar derrame pericárdico de pleural)</li></ul>
<div class="flow"><p><b>Marca del transductor</b> hacia el hombro derecho. Lo que mides aquí: diámetro telediastólico y telesistólico del VI, septo y pared inferolateral (masa), TSVI en mesosístole, raíz aórtica, AI en telesístole.</p></div>
<div class="callout red">Derrame pericárdico: pasa por <b>delante</b> de la aorta descendente. Derrame pleural: queda <b>detrás</b> de ella.</div>`},
{t:"Paraesternal eje corto (PSAX)",h:`<div class="svgbox lbl-on" id="psaxbox">${SVG_PSAX}</div>
<button class="toggle" data-tgl="psaxbox">Ocultar etiquetas para autoevaluarme</button>
<div class="flow"><p>Desde el PLAX, <b>gira 90° en sentido horario</b> (marca hacia el hombro izquierdo). Inclinando el transductor recorres cuatro niveles:</p>
<ul><li><b>Válvula aórtica:</b> el "Mercedes" de tres cúspides, AD, VD, válvula pulmonar y tricúspide alrededor.</li>
<li><b>Válvula mitral:</b> la "boca de pez". Aquí se planimetra el área mitral en la estenosis.</li>
<li><b>Músculos papilares:</b> el esquema. Seis segmentos medios del VI: el mejor nivel para valorar motilidad regional.</li>
<li><b>Ápex:</b> anillo pequeño, sin papilares.</li></ul>
<p>Septo aplanado en forma de <b>D</b>: en sístole sugiere sobrecarga de presión del VD; en diástole, sobrecarga de volumen.</p></div>`},
{t:"Vistas apicales",h:`<div class="svgbox lbl-on" id="a4cbox">${SVG_A4C}</div>
<button class="toggle" data-tgl="a4cbox">Ocultar etiquetas para autoevaluarme</button>
<div class="flow"><p><b>Apical 4 cámaras</b>: marca hacia la izquierda del paciente. El VI queda a la derecha de la pantalla. La tricúspide se inserta unos milímetros más apical que la mitral: así distingues qué ventrículo es cuál (más de 8 mm/m² sugiere Ebstein).</p>
<ul><li><b>5 cámaras:</b> inclina hacia anterior y aparece el TSVI y la válvula aórtica. Aquí van el PW del TSVI y el CW aórtico.</li>
<li><b>2 cámaras:</b> gira unos 60° antihorario. Paredes anterior e inferior; no ves el VD.</li>
<li><b>3 cámaras (eje largo apical):</b> sigue girando. Paredes anteroseptal e inferolateral, TSVI y aorta.</li></ul></div>
<div class="callout amber"><b>Acortamiento (foreshortening):</b> si el ápex se ve redondeado, grueso y se mueve mucho, no estás en el verdadero ápex. Subestimas volúmenes y te pierdes trombos apicales. Baja un espacio intercostal y lateraliza.</div>`},
{t:"Subcostal y supraesternal",h:`<div class="flow">
<ul><li><b>Subcostal 4 cámaras:</b> la mejor ventana para derrame pericárdico y colapso del VD, y para el septo interauricular (el haz es perpendicular al septo, menos dropout).</li>
<li><b>Vena cava inferior:</b> mide a 1–2 cm de la entrada en AD, perpendicular al eje del vaso. Diámetro y colapso con el olfateo estiman la presión de AD.</li>
<li><b>Supraesternal:</b> arco aórtico. Coartación (CW con flujo diastólico persistente), disección, y flujo diastólico reverso en la aorta descendente en la IA severa.</li></ul></div>
<div class="callout">En paciente crítico o ventilado, la subcostal suele ser la única ventana disponible. Practícala aunque las otras sean buenas.</div>`}
],

{id:"m3",title:"Función del ventrículo izquierdo",sub:"Tamaño, masa, fracción de eyección, segmentos y strain",
lessons:[
{t:"Dimensiones, masa y geometría",h:`<div class="flow"><p>En PLAX, al final de la diástole (inicio del QRS), mide septo, diámetro del VI y pared inferolateral, de borde a borde.</p>
<ul><li>Diámetro telediastólico normal: hombres 42–58 mm, mujeres 38–52 mm.</li>
<li>Masa (fórmula ASE): 0,8 × 1,04 × [(SIV + DdVI + PP)³ − DdVI³] + 0,6 g. Hipertrofia si el índice es &gt; 115 g/m² en hombres o &gt; 95 g/m² en mujeres.</li>
<li>Grosor parietal relativo (GPR) = 2 × PP / DdVI. Mayor de 0,42 indica geometría concéntrica.</li></ul>
<p>Con masa y GPR clasificas la geometría:</p>
<ul><li>Masa normal + GPR normal → normal.</li><li>Masa normal + GPR alto → remodelado concéntrico.</li><li>Masa alta + GPR alto → hipertrofia concéntrica (HTA, EA).</li><li>Masa alta + GPR normal → hipertrofia excéntrica (insuficiencias valvulares, miocardiopatía dilatada).</li></ul></div>`},
{t:"Fracción de eyección: Simpson biplano",h:`<div class="flow"><p>El método recomendado es el de discos de Simpson en apical 4C y 2C. Trazas el endocardio en telediástole y telesístole sin incluir trabéculas ni papilares.</p>
<div class="formula">FE = (VTD − VTS) / VTD × 100</div>
<ul><li>Normal: ≥ 52 % en hombres y ≥ 54 % en mujeres.</li>
<li>Teichholz (a partir de diámetros) no sirve si hay alteraciones regionales: asume un VI simétrico.</li>
<li>Si no ves bien dos segmentos contiguos, usa contraste o 3D.</li></ul></div>
<div class="callout amber">La FE depende de la carga. En una IM severa, una FE "normal" de 55 % ya puede indicar disfunción, porque el VI vacía parte de su volumen hacia una aurícula de baja presión.</div>`},
{t:"Segmentos y territorios coronarios",h:`<div class="flow"><p>Modelo de 17 segmentos: 6 basales, 6 medios, 4 apicales y el ápex. Cada segmento se describe como normal, hipocinético, acinético o discinético.</p>
<ul><li><b>Descendente anterior:</b> anterior, anteroseptal y la mayor parte del ápex.</li>
<li><b>Coronaria derecha:</b> inferior e inferoseptal basal y medio.</li>
<li><b>Circunfleja:</b> anterolateral e inferolateral.</li></ul>
<p>Hay variabilidad anatómica: el inferolateral y el ápex pueden depender de distintas arterias según la dominancia.</p></div>
<div class="callout">Truco: el engrosamiento importa más que el movimiento. Un segmento puede moverse arrastrado por sus vecinos y aun así no engrosar.</div>`},
{t:"Strain longitudinal global (GLS)",h:`<div class="flow"><p>El speckle tracking sigue el patrón del miocardio y mide cuánto se acorta en sentido longitudinal. Como es acortamiento, el valor es negativo.</p>
<ul><li>Normal: en torno a −20 %. Valores absolutos claramente por debajo de 16 % son anormales.</li>
<li>Detecta disfunción antes de que caiga la FE: cardiotoxicidad, valvulopatías, miocardiopatía hipertrófica, amiloidosis.</li>
<li>En cardio-onco: una caída relativa &gt; 15 % respecto al basal se considera significativa.</li>
<li>Patrón de "respeto apical" (apical sparing) en el mapa polar: sugiere amiloidosis.</li></ul></div>
<div class="callout amber">Los valores varían entre fabricantes de software. Para seguimiento, usa el mismo equipo y el mismo programa.</div>`}
],
quiz:[

{q:"VTD 150 mL, VTS 90 mL. ¿Cuál es la FE?",o:["40 %","60 %","33 %","45 %"],a:0,e:"(150 − 90) / 150 = 0,40. FE 40 %."},
{q:"Acinesia del septo anterior y del ápex. ¿Qué arteria es la sospechosa?",o:["Coronaria derecha","Circunfleja","Descendente anterior","Rama del nodo sinusal"],a:2,e:"Anteroseptal y apical son territorio típico de la descendente anterior."},
{q:"Paciente en quimioterapia: FE 58 % estable, GLS cae de −21 % a −16 %. ¿Qué significa?",o:["Nada, la FE es normal","Caída relativa de unos 24 %: disfunción subclínica","Error del equipo","Mejoría"],a:1,e:"(21 − 16) / 21 ≈ 24 % de caída relativa, por encima del 15 %. Es disfunción subclínica aunque la FE siga normal."},

]},
{id:"m4",title:"Ventrículo derecho y presiones",sub:"TAPSE, S', VCI y presión sistólica pulmonar",
lessons:[
{t:"Tamaño y función del VD",h:`<div class="flow"><p>Usa una apical 4C enfocada en el VD (lo más ancho posible sin acortarlo).</p>
<ul><li>Diámetro basal &gt; 41 mm → VD dilatado.</li>
<li><b>TAPSE</b> (modo M en el anillo tricuspídeo lateral): &lt; 17 mm es anormal.</li>
<li><b>S'</b> (Doppler tisular del anillo lateral): &lt; 9,5 cm/s es anormal.</li>
<li><b>FAC</b> (cambio fraccional de área): &lt; 35 % es anormal.</li></ul></div>
<div class="callout">TAPSE y S' miden solo la función longitudinal de la pared libre. Tras cirugía cardiaca caen aunque la función global del VD sea buena.</div>`},
{t:"Presión sistólica pulmonar",h:`<div class="flow"><div class="formula">PSAP = 4 · (Vmax IT)² + PAD</div>
<ul><li>Alinea el CW con el chorro de IT desde varias vistas y toma el máximo con envolvente bien definida.</li>
<li>Vmax IT &gt; 2,8 m/s sugiere hipertensión pulmonar. Según ESC 2022, &gt; 3,4 m/s da probabilidad alta.</li>
<li>En una IT torrencial, Bernoulli subestima: la AD y el VD se igualan.</li></ul></div>`},
{t:"Vena cava inferior y presión de AD",h:`<div class="flow"><ul>
<li>VCI ≤ 2,1 cm y colapso &gt; 50 % al olfateo → PAD ≈ 3 mmHg (0–5).</li>
<li>VCI &gt; 2,1 cm y colapso &lt; 50 % → PAD ≈ 15 mmHg (10–20).</li>
<li>Escenarios intermedios → PAD ≈ 8 mmHg.</li></ul></div>
<div class="callout amber">No aplica en ventilación mecánica con presión positiva: la VCI se dilata por el ventilador. En deportistas puede ser grande con PAD normal.</div>`},
{t:"Signos de sobrecarga del VD",h:`<div class="flow"><ul>
<li><b>Septo en D en sístole:</b> sobrecarga de presión (HP, TEP).</li>
<li><b>Septo en D en diástole:</b> sobrecarga de volumen (CIA, IT severa).</li>
<li><b>Signo de McConnell:</b> acinesia de la pared libre del VD con ápex conservado; sugiere TEP agudo.</li>
<li><b>Signo 60/60:</b> tiempo de aceleración pulmonar &lt; 60 ms con gradiente de IT &lt; 60 mmHg; apoya TEP agudo.</li>
<li>Relación VD/VI &gt; 1 en A4C: dilatación importante.</li></ul></div>`}
],
quiz:[
{q:"Vmax IT 3,2 m/s, VCI 2,4 cm con colapso de 30 %. ¿PSAP estimada?",o:["≈ 44 mmHg","≈ 56 mmHg","≈ 41 mmHg","≈ 64 mmHg"],a:1,e:"4 × 3,2² = 41 mmHg + PAD 15 (VCI > 2,1 cm y colapso < 50 %) = 56 mmHg."},
{q:"TAPSE de 14 mm significa:",o:["Función longitudinal del VD normal","Disfunción sistólica del VD","Hipertrofia del VD","Nada sin S'"],a:1,e:"El corte es 17 mm. Por debajo, disfunción sistólica longitudinal."},
{q:"Septo aplanado solo en diástole con VD dilatado. ¿Qué piensas?",o:["Sobrecarga de presión","Sobrecarga de volumen","Pericarditis constrictiva","Normal"],a:1,e:"El aplanamiento diastólico apunta a volumen: CIA, IT o IP severas, drenaje venoso anómalo."},
{q:"Paciente intubado con VCI de 2,5 cm sin colapso. ¿Qué concluyes sobre la PAD?",o:["PAD 15 mmHg","PAD 3 mmHg","El criterio no es válido en ventilación con presión positiva","Hipovolemia"],a:2,e:"La presión positiva intratorácica dilata la VCI. No uses la regla de colapso en ventilados."},
{q:"Acinesia de la pared libre del VD con ápex que se contrae. ¿Qué signo es?",o:["McConnell","Kussmaul","Rebote septal","Signo de la D"],a:0,e:"Es el signo de McConnell, asociado a TEP agudo, aunque no es exclusivo."}
]},
{id:"m5",title:"Función diastólica y aurícula izquierda",sub:"E/A, e', E/e', volumen de AI y el algoritmo ASE/EACVI 2016",
lessons:[
{t:"Flujo mitral",h:`<div class="flow"><p>PW en la punta de los velos mitrales, apical 4C.</p>
<ul><li><b>Onda E:</b> llenado rápido (depende de la relajación y de la presión de AI).</li>
<li><b>Onda A:</b> contracción auricular.</li>
<li>Patrón de relajación alterada: E/A ≤ 0,8. Patrón restrictivo: E/A ≥ 2 con tiempo de desaceleración corto.</li>
<li>Un E/A "normal" puede ser pseudonormal: por eso nunca se interpreta solo.</li></ul></div>`},
{t:"Doppler tisular: e' y E/e'",h:`<div class="flow"><p>PW tisular en el anillo mitral septal y lateral. La onda e' refleja la relajación y depende poco de la precarga.</p>
<ul><li>Anormal: e' septal &lt; 7 cm/s o e' lateral &lt; 10 cm/s.</li>
<li>E/e' promedio &gt; 14: sugiere presión de llenado elevada.</li>
<li>Volumen de AI indexado &gt; 34 mL/m²: marcador de presiones elevadas crónicas.</li></ul></div>`},
{t:"Algoritmo con FE normal",h:`<div class="flow"><p>Cuatro variables (ASE/EACVI 2016):</p>
<ul><li>e' septal &lt; 7 o lateral &lt; 10 cm/s</li><li>E/e' promedio &gt; 14</li><li>AI indexada &gt; 34 mL/m²</li><li>Vmax IT &gt; 2,8 m/s</li></ul>
<p>Más de la mitad positivas → disfunción diastólica. Menos de la mitad → normal. Exactamente la mitad → indeterminado.</p></div>
<div class="callout">Pruébalo en la calculadora "Función diastólica".</div>`},
{t:"Con FE reducida: estimar presiones",h:`<div class="flow"><ul>
<li>E/A ≤ 0,8 y E ≤ 50 cm/s → presión de AI normal (grado I).</li>
<li>E/A ≥ 2 → presión de AI elevada (grado III).</li>
<li>Resto: mira E/e' &gt; 14, Vmax IT &gt; 2,8 m/s y AI &gt; 34 mL/m². Si 2 o 3 son positivos → presión elevada (grado II). Si 2 o 3 son negativos → normal (grado I).</li></ul></div>
<div class="callout amber">No se aplica igual en fibrilación auricular, estenosis o insuficiencia mitral significativa, prótesis mitral ni trasplante cardiaco.</div>`}
],

{id:"m6",title:"Valvulopatías",sub:"Estenosis aórtica, insuficiencias y estenosis mitral",
lessons:[
{t:"Estenosis aórtica",h:`<div class="flow"><ul>
<li><b>Severa:</b> Vmax ≥ 4 m/s, gradiente medio ≥ 40 mmHg, AVA &lt; 1,0 cm² (indexada &lt; 0,6 cm²/m²), índice adimensional (DVI) &lt; 0,25.</li>
<li>AVA por continuidad: AVA = área TSVI × ITV TSVI / ITV Ao.</li>
<li>El diámetro del TSVI se eleva al cuadrado: 1 mm de error cambia el área un 10 %. Mide en mesosístole, zoom en PLAX.</li></ul>
<p><b>Bajo flujo, bajo gradiente</b>: AVA &lt; 1 cm² pero gradiente &lt; 40 mmHg.</p>
<ul><li>FE reducida → eco con dobutamina (¿EA verdaderamente severa o pseudoestenosis?).</li>
<li>FE conservada (bajo flujo paradójico) → calcio valvular por TC.</li></ul></div>`},
{t:"Insuficiencia mitral",h:`<figure><div class="screen" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><img src="${IMG.vc4c}" alt="Vena contracta estrecha en apical 4 cámaras"><img src="${IMG.vc2c}" alt="Vena contracta ancha en apical 2 cámaras del mismo chorro"></div>
<figcaption>Mismo chorro: VC estrecha en 4C y ancha en 2C (orificio elíptico). BSE, Echo Res Pract 2021, CC BY-NC-ND 4.0.</figcaption></figure>
<div class="flow"><ul>
<li><b>Severa:</b> VC ≥ 7 mm (biplana ≥ 8 mm), EROA ≥ 0,4 cm², volumen regurgitante ≥ 60 mL, fracción regurgitante ≥ 50 %.</li>
<li>Signos de apoyo: inversión sistólica en venas pulmonares, onda E &gt; 1,2 m/s, CW denso y triangular.</li>
<li>Primaria (prolapso, flail) vs. secundaria (VI dilatado, tethering): el orificio de la secundaria suele ser elíptico y PISA lo subestima.</li></ul></div>`},
{t:"Insuficiencia aórtica",h:`<div class="flow"><ul>
<li><b>Severa:</b> VC &gt; 6 mm, ancho del chorro ≥ 65 % del TSVI, PHT &lt; 200 ms, EROA ≥ 0,3 cm², volumen regurgitante ≥ 60 mL.</li>
<li><b>Reflujo holodiastólico</b> en aorta descendente (supraesternal) o abdominal: muy específico de IA severa.</li>
<li>El PHT acortado también aparece si la presión del VI sube por otra razón (disfunción diastólica): interprétalo junto a lo demás.</li>
<li>Mide la aorta ascendente: la dilatación de la raíz es una causa frecuente y cambia la indicación quirúrgica.</li></ul></div>`},
{t:"Estenosis mitral",h:`<div class="flow"><ul>
<li><b>Planimetría</b> en PSAX a nivel de la punta de los velos: el método de referencia anatómico.</li>
<li><b>PHT:</b> AVM = 220 / PHT. No es válido justo después de una valvuloplastia ni si hay IA severa o VI rígido.</li>
<li>Significativa: AVM ≤ 1,5 cm². Gradiente medio: depende de la frecuencia cardiaca, repórtalo con la FC.</li>
<li>Score de Wilkins (movilidad, engrosamiento, calcificación, subvalvular): ≤ 8 favorece valvuloplastia percutánea.</li></ul></div>`},
{t:"Insuficiencia tricuspídea",h:`<div class="flow"><ul>
<li><b>Severa:</b> VC ≥ 7 mm, EROA ≥ 0,4 cm², inversión sistólica en venas suprahepáticas, CW denso y triangular.</li>
<li>Escala ampliada: masiva y torrencial (VC ≥ 14 mm y ≥ 21 mm), útil en la era de tratamientos percutáneos.</li>
<li>Busca la causa: dilatación anular por FA o HP, cables de marcapasos, Ebstein, endocarditis.</li></ul></div>`}
],

const EXTRA_LESSONS={
m1:[
{t:"Simulador: ángulo Doppler",h:`<div class="flow"><p>Mueve el ángulo y mira cuánto se pierde de la velocidad real. Es la razón por la que el CW de la estenosis aórtica se busca desde varias ventanas.</p></div><div class="widget" data-w="angle"></div>`},

{t:"Modo M y Doppler tisular",h:`<div class="flow"><ul>
<li><b>Modo M:</b> una sola línea de interrogación en el tiempo. Su resolución temporal (más de 1000 líneas/s) lo hace ideal para eventos rápidos: SAM mitral, aleteo diastólico del velo anterior en la IA, TAPSE, colapso de cavidades.</li>
<li><b>Modo M color:</b> el tiempo exacto de un chorro (IM telesistólica) y la velocidad de propagación del flujo mitral (Vp).</li>
<li><b>Doppler tisular (TDI):</b> el miocardio se mueve lento (5–20 cm/s) pero refleja mucho. El equipo invierte los filtros: deja pasar señales lentas y de alta amplitud. Así se miden e', a' y s'.</li></ul></div>
<div class="callout">Modo M depende del ángulo como cualquier medición lineal: si la línea no es perpendicular al septo y la pared, sobreestimas los grosores.</div>`},
{t:"Artefactos que tienes que reconocer",h:`<div class="flow"><ul>
<li><b>Reverberación:</b> líneas paralelas repetidas detrás de una estructura muy reflectante (prótesis, cable, pericardio calcificado). Puede simular un flap de disección en la aorta.</li>
<li><b>Sombra acústica:</b> zona negra detrás de calcio o metal. Oculta vegetaciones y trombos en prótesis mecánicas: por eso se necesita el ETE.</li>
<li><b>Imagen en espejo:</b> duplicado de una estructura al otro lado de un reflector fuerte.</li>
<li><b>Lóbulo lateral y haz ancho:</b> ecos falsos dentro de cavidades, típicos en la aorta ascendente y la AI.</li>
<li><b>Dropout:</b> pérdida de señal cuando la estructura es paralela al haz. El septo interauricular "desaparece" en apical 4C sin que exista CIA. Confírmalo en subcostal.</li>
<li><b>Clutter de campo cercano:</b> ruido en el ápex que imita o esconde un trombo apical. Usa transductor de alta frecuencia o contraste.</li></ul></div>
<div class="callout amber">Un artefacto no respeta la anatomía: atraviesa paredes, se mueve en sincronía con otra estructura y desaparece al cambiar de ventana. Una lesión real se ve en dos planos.</div>`}
],
m2:[

<div class="flow"><p>En 2C no debe aparecer ningún segmento del VD. En 3C ves la aorta saliendo del VI: es el equivalente apical del PLAX. En la subcostal el hígado es la ventana acústica y el VD queda arriba, cerca del transductor.</p></div>`}

m4:[
{t:"Probabilidad de hipertensión pulmonar (ESC/ERS 2022)",h:`<div class="flow"><p>La Vmax de IT no basta. Se combina con signos de otras tres categorías:</p>
<ul><li><b>Ventrículos:</b> relación VD/VI basal &gt; 1; septo aplanado (índice de excentricidad &gt; 1,1).</li>
<li><b>Arteria pulmonar:</b> tiempo de aceleración del TSVD &lt; 105 ms o muesca mesosistólica; velocidad protodiastólica de IP &gt; 2,2 m/s; diámetro de la AP mayor que la raíz aórtica o &gt; 25 mm.</li>
<li><b>VCI y AD:</b> VCI &gt; 21 mm con colapso reducido; área de AD &gt; 18 cm².</li></ul>
<p>Resultado:</p>
<ul><li><b>Baja:</b> IT ≤ 2,8 m/s o no medible, sin otros signos.</li>
<li><b>Intermedia:</b> IT ≤ 2,8 con signos de otras categorías, o IT 2,9–3,4 sin signos.</li>
<li><b>Alta:</b> IT 2,9–3,4 con signos de otras categorías, o IT &gt; 3,4.</li></ul>
<p>Un TAPSE/PSAP &lt; 0,55 mm/mmHg indica mal acoplamiento VD-arterial y peor pronóstico.</p></div>
<div class="callout">La calculadora "PSAP" ya integra esta clasificación.</div>`}
],

const NEW_LESSONS={
aortic:[
{t:"Válvula aórtica bicúspide",h:`<div class="svgbox lbl-on" id="avbox">${SVG_PSAXAV}</div><button class="toggle" data-tgl="avbox">Ocultar etiquetas para autoevaluarme</button>
<div class="flow"><ul>
<li>Es la cardiopatía congénita más frecuente (1–2 % de la población).</li>
<li>Diagnóstico en PSAX en <b>sístole</b>: apertura en "boca de pez" con dos comisuras. En diástole el rafe puede imitar tres cúspides.</li>
<li>La fusión más frecuente es coronaria derecha con izquierda (70–80 %).</li>
<li>En PLAX: cierre excéntrico y "doming" sistólico de las valvas.</li>
<li>Asocia aortopatía (raíz y aorta ascendente) y coartación. Mide siempre la aorta ascendente y mira el arco desde supraesternal.</li>
<li>Recomienda cribado ecográfico a los familiares de primer grado.</li></ul></div>`},
{t:"Estenosis aórtica de bajo flujo",h:`<div class="flow"><p>Cuando AVA &lt; 1 cm² pero el gradiente medio es &lt; 40 mmHg, mira el volumen latido indexado (VLi). Bajo flujo = VLi &lt; 35 mL/m².</p>
<ul><li><b>FE reducida (clásica):</b> eco con dobutamina a dosis bajas. EA severa verdadera si el gradiente llega a ≥ 40 mmHg con AVA que sigue ≤ 1 cm². Pseudoestenosis si el AVA se abre &gt; 1 cm². Reserva contráctil = aumento del VL ≥ 20 %.</li>
<li><b>FE conservada (paradójica):</b> VI pequeño e hipertrófico, típico de mujeres mayores. Calcio valvular por TC: severa probable con ≥ 2000 UA en hombres y ≥ 1200 UA en mujeres.</li>
<li><b>Flujo normal, gradiente bajo:</b> casi siempre error de medida (TSVI subestimado o Vmax infraestimada). Revisa antes de etiquetar.</li></ul></div>
<div class="callout amber">Antes de concluir "bajo gradiente", confirma que interrogaste la Vmax desde apical, paraesternal derecha y supraesternal.</div>`},
{t:"Cuándo intervenir en la EA",h:`<div class="flow"><ul>
<li>EA severa con síntomas (disnea, angina, síncope): intervención.</li>
<li>EA severa asintomática con FE &lt; 50 % sin otra causa: intervención.</li>
<li>Asintomática con prueba de esfuerzo anormal (síntomas o caída de la presión arterial): intervención.</li>
<li>Muy severa (Vmax ≥ 5 m/s), progresión rápida (≥ 0,3 m/s al año) o BNP muy elevado en asintomáticos: se considera intervención temprana.</li>
<li>TAVI frente a cirugía: lo decide el Heart Team según edad, riesgo quirúrgico y anatomía.</li></ul></div>`}
],
mitral:[
{t:"Mecanismo: clasificación de Carpentier",h:`<div class="svgbox lbl-on" id="mvbox">${SVG_PSAXMV}</div><button class="toggle" data-tgl="mvbox">Ocultar etiquetas para autoevaluarme</button>
<div class="flow"><ul>
<li><b>Tipo I</b> (movimiento normal): dilatación anular (FA, miocardiopatía) o perforación (endocarditis). Chorro central.</li>
<li><b>Tipo II</b> (movimiento excesivo): prolapso o flail. El chorro va hacia el lado <b>opuesto</b> al velo afectado: prolapso posterior → chorro anterior.</li>
<li><b>Tipo IIIa</b> (restricción en sístole y diástole): reumática.</li>
<li><b>Tipo IIIb</b> (restricción en sístole): isquémica o miocardiopatía dilatada, por tethering. El chorro va hacia el lado del velo más restringido.</li></ul>
<p>Segmentos: velo anterior A1–A3 y posterior P1–P3, de la comisura anterolateral (1) a la posteromedial (3). P2 es el segmento que más prolapsa.</p></div>`},
{t:"Prolapso, Barlow y disyunción anular",h:`<div class="flow"><ul>
<li><b>Prolapso:</b> desplazamiento del velo &gt; 2 mm por encima del plano anular en <b>PLAX</b> (el anillo es en silla de montar; en 4C se sobrediagnostica).</li>
<li><b>Flail:</b> la punta del velo apunta hacia la AI, habitualmente por rotura de cuerda. Es criterio de IM severa.</li>
<li><b>Enfermedad de Barlow:</b> velos redundantes y gruesos, prolapso multisegmentario. Reparación más compleja.</li>
<li><b>Deficiencia fibroelástica:</b> velos finos, prolapso de un segmento (típico P2). Reparación más sencilla.</li>
<li><b>Disyunción anular (MAD):</b> separación entre la pared del VI y el anillo posterior en sístole. Se asocia a arritmias ventriculares.</li></ul></div>`},
{t:"Cuándo intervenir en la IM primaria",h:`<div class="flow"><ul>
<li>IM severa sintomática: cirugía, preferentemente reparación.</li>
<li>Asintomática con FE ≤ 60 % o DsVI ≥ 40 mm: cirugía.</li>
<li>Asintomática con FA nueva o PSAP &gt; 50 mmHg: se considera cirugía.</li>
<li>Alta probabilidad de reparación duradera y bajo riesgo: la reparación precoz es razonable aunque falten esos criterios.</li>
<li>IM secundaria: primero tratamiento médico óptimo y resincronización si corresponde. Reparación percutánea borde a borde en pacientes seleccionados con IM desproporcionada.</li></ul></div>`}
]};

const MOD_PROS={id:"m8",title:"Prótesis y endocarditis",sub:"Gradientes protésicos, desproporción y criterios ecográficos de endocarditis",
lessons:[
{t:"Cómo se evalúa una prótesis",h:`<div class="flow"><ul>
<li>Necesitas el tipo y el tamaño de la prótesis, la fecha y la frecuencia cardiaca. Lo ideal es un eco basal 6 semanas a 3 meses tras el implante como referencia.</li>
<li><b>Prótesis mecánicas</b> (bidisco, la más habitual): ecos de las aletas con sombra y reverberación; flujo de lavado (washing jets) pequeño y normal.</li>
<li><b>Biológicas:</b> parecen válvulas nativas; degeneran con los años (estenosis o insuficiencia).</li>
<li>Toda prótesis es algo estenótica comparada con una válvula nativa. Lo importante es el cambio respecto al eco basal.</li></ul></div>`},
{t:"Prótesis aórtica: ¿obstrucción?",h:`<div class="flow"><table class="mini"><thead><tr><th>Parámetro</th><th>Normal</th><th>Posible estenosis</th><th>Sugiere estenosis</th></tr></thead><tbody>
<tr><td>Vmax</td><td>&lt; 3 m/s</td><td>3–4 m/s</td><td>&gt; 4 m/s</td></tr>
<tr><td>Gradiente medio</td><td>&lt; 20 mmHg</td><td>20–35</td><td>&gt; 35</td></tr>
<tr><td>DVI (ITV TSVI / ITV prótesis)</td><td>≥ 0,30</td><td>0,25–0,29</td><td>&lt; 0,25</td></tr>
<tr><td>Tiempo de aceleración</td><td>&lt; 80 ms</td><td>80–100 ms</td><td>&gt; 100 ms</td></tr>
<tr><td>Forma del espectro</td><td>Triangular, pico temprano</td><td>Intermedia</td><td>Redondeada, pico tardío</td></tr></tbody></table>
<p>Gradiente alto con DVI normal y tiempo de aceleración corto: piensa en <b>alto flujo</b> (anemia, fiebre, IA) o en <b>desproporción paciente-prótesis</b>, no en obstrucción.</p></div>`},
{t:"Desproporción paciente-prótesis",h:`<div class="flow"><p>La prótesis funciona bien pero es pequeña para el paciente. Se mide con el área efectiva indexada (EOAi):</p>
<ul><li><b>Aórtica:</b> sin desproporción &gt; 0,85 cm²/m²; moderada 0,65–0,85; severa &lt; 0,65 (en obesos con IMC ≥ 30 los cortes bajan a 0,70 y 0,55).</li>
<li><b>Mitral:</b> sin desproporción &gt; 1,2 cm²/m²; moderada 0,9–1,2; severa &lt; 0,9.</li></ul>
<p>Diferencia clave con la obstrucción: en la desproporción la morfología y la movilidad de los velos son normales y el DVI suele ser normal.</p></div>`},
{t:"Prótesis mitral",h:`<div class="flow"><ul>
<li>Normal: E pico ≤ 1,9 m/s, gradiente medio ≤ 5 mmHg, ITV prótesis / ITV TSVI &lt; 2,2, EOA ≥ 2 cm², PHT &lt; 130 ms.</li>
<li>Si el gradiente y el ITV están elevados con PHT normal, sospecha <b>insuficiencia</b> protésica (más flujo anterógrado).</li>
<li>La insuficiencia de una prótesis mitral mecánica casi no se ve en ETT por la sombra acústica en la AI: si la sospechas, ETE.</li></ul></div>`},
{t:"Endocarditis: qué buscar",h:`<div class="flow"><p>Criterios mayores de imagen (Duke-ISCVID 2023):</p>
<ul><li>Vegetación: masa oscilante sobre el lado de baja presión del chorro (lado auricular de la mitral, ventricular de la aórtica).</li>
<li>Perforación o aneurisma valvular.</li>
<li>Absceso o seudoaneurisma perivalvular (frecuente en la raíz aórtica y en prótesis).</li>
<li>Fístula intracardiaca.</li>
<li>Insuficiencia valvular nueva o dehiscencia parcial nueva de una prótesis.</li></ul>
<p>El ETT tiene sensibilidad limitada (especialmente en prótesis y vegetaciones &lt; 5 mm). Un ETT negativo con sospecha clínica alta exige ETE.</p></div>
<div class="callout red">Vegetación ≥ 10 mm con embolia, absceso, insuficiencia severa con insuficiencia cardiaca o infección no controlada: valorar cirugía precoz.</div>`}
],

const MOD_PERI={id:"m9",title:"Pericardio y miocardiopatías",sub:"Taponamiento, constricción, MCH, amiloidosis, Takotsubo y otras",
lessons:[
{t:"Derrame y taponamiento",h:`<div class="flow"><ul>
<li>Cuantificación en diástole: pequeño &lt; 10 mm, moderado 10–20 mm, grande &gt; 20 mm.</li>
<li>Grasa epicárdica: anterior, ecogénica, se mueve con el corazón. El derrame es anecoico y aparece primero en la zona posterior (declive).</li>
<li>El taponamiento depende de la velocidad de acumulación, no solo del volumen.</li></ul>
<p>Signos ecográficos de taponamiento:</p>
<ul><li>Colapso de la AD durante más de un tercio de la sístole (sensible).</li>
<li>Colapso diastólico del VD (más específico).</li>
<li>VCI dilatada sin colapso inspiratorio.</li>
<li>Variación respiratoria del flujo mitral &gt; 25 % y tricuspídeo &gt; 40 %.</li>
<li>Bamboleo del corazón (swinging) en derrames grandes.</li></ul></div>
<div class="callout red">El diagnóstico de taponamiento es clínico y ecográfico. En hipertensión pulmonar o hipertrofia del VD puede no haber colapso del VD aunque haya taponamiento.</div>`},
{t:"Constricción frente a restricción",h:`<div class="flow"><table class="mini"><thead><tr><th></th><th>Constricción</th><th>Restricción</th></tr></thead><tbody>
<tr><td>e' medial</td><td>Normal o alta (&gt; 8–9 cm/s)</td><td>Baja (&lt; 6–7)</td></tr>
<tr><td>e' medial frente a lateral</td><td>Medial &gt; lateral (annulus reversus)</td><td>Lateral &gt; medial</td></tr>
<tr><td>Variación respiratoria de E mitral</td><td>&gt; 25 %</td><td>&lt; 10 %</td></tr>
<tr><td>Septo</td><td>Rebote septal, desplazamiento respiratorio</td><td>Sin rebote</td></tr>
<tr><td>Venas suprahepáticas</td><td>Reverso diastólico en espiración</td><td>Reverso en inspiración</td></tr>
<tr><td>Pericardio</td><td>Engrosado o calcificado (no siempre)</td><td>Normal</td></tr>
<tr><td>Paredes</td><td>Grosor normal</td><td>Engrosadas (amiloidosis)</td></tr></tbody></table>
<p>Criterios de la Mayo: desplazamiento septal respiratorio, e' medial ≥ 9 cm/s y reverso espiratorio en suprahepáticas.</p></div>`},
{t:"Miocardiopatía hipertrófica",h:`<div class="flow"><ul>
<li>Grosor parietal ≥ 15 mm en cualquier segmento (≥ 13 mm con familiar afecto) sin causa de sobrecarga que lo explique.</li>
<li>Patrón típico: hipertrofia septal asimétrica. Variante apical: busca el "as de picas" en 4C, a veces solo visible con contraste.</li>
<li><b>Obstrucción del TSVI:</b> gradiente ≥ 30 mmHg en reposo o provocado. ≥ 50 mmHg es hemodinámicamente significativo. Provócalo con Valsalva y bipedestación.</li>
<li>CW del TSVI con forma de <b>daga</b>: pico tardío. Distínguelo de la IM (pico temprano y más rápido).</li>
<li><b>SAM:</b> movimiento sistólico anterior de la mitral que contacta el septo; produce IM posterior.</li>
<li>Grosor ≥ 30 mm es factor de riesgo de muerte súbita.</li></ul></div>`},
{t:"Amiloidosis, Takotsubo y otras",h:`<div class="flow"><ul>
<li><b>Amiloidosis:</b> paredes gruesas con ECG de bajo voltaje (discordancia clave), aurículas dilatadas, septo interauricular y válvulas engrosados, derrame pequeño, llenado restrictivo y strain con <b>respeto apical</b>.</li>
<li><b>Takotsubo:</b> balonamiento apical con hipercinesia basal, alteración que excede un único territorio coronario. Puede causar obstrucción dinámica del TSVI. Recupera en semanas.</li>
<li><b>Miocardiopatía dilatada:</b> VI dilatado con FE reducida, IM funcional, a veces trombo apical.</li>
<li><b>No compactación:</b> trabeculación prominente con recesos que se llenan de color; relación capa no compactada/compactada &gt; 2 en sístole (Jenni). Se sobrediagnostica.</li>
<li><b>Displasia arritmogénica del VD:</b> VD dilatado con aneurismas o discinesias regionales; complementa con RM.</li></ul></div>`}
],

const MOD_AORTA={id:"m10",title:"Aorta, congénitas del adulto y eco en el paciente crítico",sub:"Medidas aórticas, disección, CIA, FOP, CIV, coartación y eco en el shock",
lessons:[
{t:"Aorta torácica",h:`<div class="flow"><ul>
<li>Mide en PLAX, en telediástole, de borde de ataque a borde de ataque: anillo (en mesosístole, borde interno), senos de Valsalva, unión sinotubular y aorta ascendente.</li>
<li>Indexa por superficie corporal y edad. Como orientación, los senos superan raramente 40 mm en adultos.</li>
<li>Umbrales quirúrgicos de la aorta ascendente: en general ≥ 55 mm; en Marfan ≥ 50 mm (menos con factores de riesgo); en válvula bicúspide 50–55 mm según el riesgo.</li>
<li><b>Disección:</b> flap intimal que se mueve independiente de la pared; luz verdadera que se expande en sístole. Busca IA, derrame pericárdico y alteraciones de la motilidad (afectación coronaria). El ETT no la descarta: TC o ETE.</li></ul></div>`},
{t:"CIA y foramen oval permeable",h:`<div class="flow"><ul>
<li><b>Ostium secundum</b> (70–75 %): en la fosa oval. Candidata a cierre percutáneo si los bordes son suficientes.</li>
<li><b>Ostium primum:</b> parte baja del septo, forma parte del canal AV; asocia cleft mitral.</li>
<li><b>Seno venoso superior:</b> cerca de la entrada de la VCS, asocia drenaje anómalo de las venas pulmonares derechas. Fácil de perder en ETT.</li>
<li>Repercusión: VD y AD dilatados, septo aplanado en diástole, Qp/Qs &gt; 1,5 indica shunt significativo.</li>
<li><b>FOP:</b> estudio con burbujas y Valsalva. Burbujas en AI en los 3 primeros latidos tras opacificar la AD = shunt intracardiaco. Si aparecen después de 3–5 latidos, sugiere shunt intrapulmonar.</li></ul></div>`},
{t:"CIV, coartación y Qp/Qs",h:`<div class="flow"><ul>
<li><b>CIV perimembranosa</b> es la más frecuente en el adulto; las musculares pequeñas suelen cerrarse en la infancia.</li>
<li>CIV restrictiva: velocidad VI→VD alta (&gt; 4 m/s). Permite estimar la PSVD = PAS sistémica − 4v².</li>
<li><b>Coartación:</b> en supraesternal, CW de la aorta descendente con velocidad alta y "cola" diastólica (flujo anterógrado persistente). En aorta abdominal, flujo amortiguado. Asocia bicúspide en más de la mitad.</li></ul>
<div class="formula">Qp/Qs = (área TSVD × ITV TSVD) / (área TSVI × ITV TSVI)</div></div>`},
{t:"Eco en el paciente en shock",h:`<div class="flow"><p>Un eco enfocado responde preguntas binarias rápidas: ¿hay derrame?, ¿cómo contrae el VI?, ¿está dilatado el VD?, ¿cómo es la VCI?</p>
<ul><li><b>Hipovolémico:</b> VI pequeño e hiperdinámico (paredes que casi se tocan), VCI pequeña y colapsable.</li>
<li><b>Cardiogénico:</b> VI dilatado e hipocinético, VCI dilatada, líneas B en pulmón.</li>
<li><b>Obstructivo:</b> derrame con colapso de cavidades (taponamiento) o VD dilatado con septo en D (TEP). Neumotórax a tensión con ausencia de deslizamiento pleural.</li>
<li><b>Distributivo:</b> VI hiperdinámico con VCI normal o pequeña al inicio.</li></ul></div>
<div class="callout">El eco enfocado no reemplaza el estudio completo: si cambia la conducta o hay duda, pide un eco reglado.</div>`}
],

alias(el){
  el.innerHTML=`<div class="wbox"><div class="screen"><canvas id="w-cv" width="720" height="260" style="width:100%;height:auto;display:block"></canvas></div>
  <div class="fields"><label for="w-pv">Velocidad pico del flujo (alejándose): <b id="w-pvv"></b><input type="range" id="w-pv" min="0.4" max="5.5" step="0.1" value="1.6"></label>
  <label for="w-ny">Escala (Nyquist): <b id="w-nyv"></b><input type="range" id="w-ny" min="0.3" max="2" step="0.05" value="1"></label>
  <label for="w-bl">Línea de base: <b id="w-blv"></b><input type="range" id="w-bl" min="-0.9" max="0.9" step="0.05" value="0"></label>
  <label class="chk"><input type="checkbox" id="w-cw"> Doppler continuo (CW)</label></div>
  <p class="muted" id="w-alres"></p></div>`;
  const cv=el.querySelector("#w-cv"), g=cv.getContext("2d");
  const ids=["w-pv","w-ny","w-bl","w-cw"].map(i=>el.querySelector("#"+i));
  const draw=()=>{const V=+ids[0].value, N=+ids[1].value, s=+ids[2].value, cw=ids[3].checked;
    el.querySelector("#w-pvv").textContent=fmt(V,1)+" m/s"; el.querySelector("#w-nyv").textContent="± "+fmt(N,2)+" m/s"; el.querySelector("#w-blv").textContent=s>0?"sube":s<0?"baja":"centrada";
    const W=cv.width,H=cv.height, top=cw?Math.max(1,V*1.25):N*(1+s), bot=cw?-Math.max(1,V*1.25):-N*(1-s);
    const y=v=>12+(top-v)/(top-bot)*(H-40);
    g.fillStyle="#05080b"; g.fillRect(0,0,W,H);
    g.strokeStyle="rgba(255,255,255,.12)"; g.lineWidth=1; g.font="12px monospace"; g.fillStyle="rgba(255,255,255,.6)";
    const step=(top-bot)>4?1:0.5;
    for(let t=Math.ceil(bot/step)*step;t<=top;t+=step){g.beginPath();g.moveTo(44,y(t));g.lineTo(W,y(t));g.stroke();g.fillText((t>0?"+":"")+t.toFixed(1),4,y(t)+4);}
    g.strokeStyle="#7fb2ff"; g.lineWidth=1.5; g.beginPath(); g.moveTo(44,y(0)); g.lineTo(W,y(0)); g.stroke();
    let aliased=false;
    for(let x=44;x<W;x++){const ph=((x-44)/(W-44)*3)%1; let sh=ph<0.34?Math.pow(Math.sin(Math.PI*ph/0.34),1.2)*(1-0.15*ph/0.34):0; const v=-V*sh; if(sh<=0) continue;
      const segs=[]; if(cw||v>=bot) segs.push([0,v]); else {aliased=true; segs.push([0,bot]); segs.push([top,v+2*N]);}
      for(const [a,b] of segs){const y1=y(a),y2=y(b); const grad=g.createLinearGradient(0,y1,0,y2); grad.addColorStop(0,"rgba(255,255,255,.35)"); grad.addColorStop(1,"rgba(255,255,255,.95)"); g.fillStyle=grad; g.fillRect(x,Math.min(y1,y2),1,Math.abs(y2-y1)); }
      if(Math.random()<0.35){g.fillStyle="rgba(255,255,255,.25)"; g.fillRect(x,y(v*Math.random()),1,2);} }
    g.fillStyle="rgba(255,255,255,.75)"; g.fillText(cw?"CW":"PW · Nyquist ±"+N.toFixed(2)+" m/s",W-190,H-10);
    el.querySelector("#w-alres").innerHTML=cw?"CW no tiene límite de Nyquist: ves la velocidad completa, pero no sabes a qué profundidad está.":aliased?`<b>Aliasing.</b> El pico (${fmt(V,1)} m/s) supera el rango negativo disponible (${fmt(-bot,2)} m/s) y reaparece arriba. Baja la línea de base, sube la escala o pasa a CW.`:`Sin aliasing: el rango negativo (${fmt(-bot,2)} m/s) cubre el pico.`;};
  ids.forEach(i=>i.addEventListener("input",draw)); draw();
},

      <div><b>${streak()}</b><span>${streak()===1?"día":"días"} estudiando seguidos</span></div>
      <div><b>${mastered}</b><span>tarjetas ya memorizadas, de ${ALLCARDS.length}</span></div>
      <div><b>${casesOk} de ${CASES.length}</b><span>casos acertados</span></div>
      <div><b>${best===null?"Sin hacer":best+" %"}</b><span>mejor nota en examen</span></div></div>`:"";
  const items=MODULES.map((m,i)=>{
    const done=!!S.done[m.id], open=isOpen(i);
    const st=done?"st-done":open?"st-open":"st-lock";
    const c=done?chip("Aprobado ("+S.done[m.id]+"/5)","c-done"):open?chip("Abierto","c-open"):chip("Se abre al aprobar el "+i,"c-lock");
    return `<li class="${st}"><span class="node">${done?"✓":i+1}</span>
      <button class="mcard" data-mod="${m.id}" ${open?"":"disabled"}>
        <span class="row"><h3>${esc(m.title)}</h3>${c}</span>
        <span class="muted">${esc(m.sub)}</span>
        <span class="small muted">${m.lessons.length} lecciones y un quiz</span>
      </button></li>`;}).join("");
  app.innerHTML=`<section class="view">
    ${hero}${how}${stats}
    <h3 class="sec">Los ${MODULES.length} módulos</h3>
    <ol class="path">${items}</ol>
    <label class="freebox"><input type="checkbox" id="free" ${S.free?"checked":""}> Abrir todos los módulos sin tener que aprobar el anterior</label>
    <h3 class="sec">Otras secciones</h3>
    <div class="sgrid">${SECTIONS.map(s=>`<button data-goto="${s[0]}"><b>${s[1]}</b><span>${s[2]}</span></button>`).join("")}</div>
    ${window.Cloud?Cloud.footer():`<p class="small muted">${remoteRef?"Tu progreso se guarda en tu cuenta y lo ves en cualquier dispositivo.":"Tu progreso se guarda en este navegador."}</p>`}
  </section>`;
  const g=$("#go"); if(g) g.onclick=()=>{openMod(nx.m.id); cur.step=nx.step; render();};
  app.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{view=b.dataset.goto;render();window.scrollTo({top:0});});
  app.querySelectorAll("[data-mod]").forEach(b=>b.addEventListener("click",()=>openMod(b.dataset.mod)));
  $("#free").addEventListener("change",e=>{S.free=e.target.checked;save(false);render();});
}
function newQuiz(m){return {qs:shuffle(m.quiz).slice(0,5),qi:0,ans:null,score:0,finished:false};}
function openMod(id){const m=MODULES.find(x=>x.id===id); cur=Object.assign({mod:id,step:0},newQuiz(m)); view="mod:"+id; render(); window.scrollTo({top:0});}

/* ---------- Módulo ---------- */
function renderMod(){
  const m=MODULES.find(x=>x.id===cur.mod); const L=m.lessons.length;
  S.seen[m.id]=S.seen[m.id]||{};
  const steps=m.lessons.map((l,i)=>`<button data-step="${i}" class="${S.seen[m.id][i]?"seen":""}" ${cur.step===i?'aria-current="step"':""} title="${esc(l.t)}">${i+1}</button>`).join("")+`<button data-step="${L}" ${cur.step===L?'aria-current="step"':""}>Quiz</button>`;
  let body;
  if(cur.step<L){
    if(!S.seen[m.id][cur.step]){S.seen[m.id][cur.step]=1; save();}
    const l=m.lessons[cur.step];
    body=`<article class="lesson"><span class="eyebrow">Lección ${cur.step+1} de ${L}</span><h3>${esc(l.t)}</h3>${l.h}</article>
    <div class="nav2"><button class="btn" data-go="${cur.step-1}" ${cur.step===0?"disabled":""}>Anterior</button>
    <button class="btn primary" data-go="${cur.step+1}">${cur.step===L-1?"Ir al quiz":"Siguiente"}</button></div>`;
  } else body=renderQuiz(m);
  app.innerHTML=`<section class="view"><button class="back" id="back">← Volver a la ruta</button>
    <div><span class="eyebrow">Módulo ${MODULES.indexOf(m)+1}</span><h2>${esc(m.title)}</h2></div>
    <div class="steps">${steps}</div>${body}</section>`;
  $("#back").onclick=()=>{view="ruta";render();};
  app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{cur.step=+b.dataset.step;render();});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{cur.step=+b.dataset.go;render();window.scrollTo({top:0});});
  bindQuiz(m);
}
function qHTML(q,ans,label){
  const opts=q.o.map((o,i)=>{let cls="opt"; if(ans!==null){ if(i===q.a) cls+=" ok"; else if(i===ans) cls+=" bad"; }
    return `<button class="${cls}" data-opt="${i}" ${ans!==null?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;}).join("");
  return `<span class="eyebrow">${label}</span><h4>${esc(q.q)}</h4><div class="opts">${opts}</div>`;
}
function renderQuiz(m){
  if(cur.finished){
    const pass=cur.score>=4;
    return `<article class="lesson"><span class="eyebrow">Resultado</span><div class="score">${cur.score}/5</div>
      <p>${pass?"Aprobado. "+(MODULES.indexOf(m)<MODULES.length-1?"El siguiente módulo ya está abierto.":"Terminaste la ruta."):"Te faltó poco. Repasa las lecciones y vuelve a intentarlo: saldrán otras preguntas."}</p>
      <div class="nav2"><button class="btn" id="qretry">Nuevo intento</button><button class="btn primary" id="qdone">Volver a la ruta</button></div></article>`;
  }
  const q=cur.qs[cur.qi];
  return `<article class="lesson q">${qHTML(q,cur.ans,"Pregunta "+(cur.qi+1)+" de 5 · aciertos "+cur.score)}
    ${cur.ans!==null?`<div class="expl"><b>${cur.ans===q.a?"Correcto.":"No es esa."}</b> ${esc(q.e)}</div><div class="nav2"><span></span><button class="btn primary" id="qnext">${cur.qi===4?"Ver resultado":"Siguiente pregunta"}</button></div>`:""}</article>`;
}
function bindQuiz(m){
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{cur.ans=+b.dataset.opt; if(cur.ans===cur.qs[cur.qi].a) cur.score++; render();});
  const n=$("#qnext"); if(n) n.onclick=()=>{ if(cur.qi===4){cur.finished=true; if(cur.score>=4){S.done[m.id]=Math.max(S.done[m.id]||0,cur.score);} save();} else {cur.qi++;cur.ans=null;} render();};
  const r=$("#qretry"); if(r) r.onclick=()=>{Object.assign(cur,newQuiz(m));render();};
  const d=$("#qdone"); if(d) d.onclick=()=>{view="ruta";render();window.scrollTo({top:0});};
}

const PLAX_PINS=[["Tracto de salida del VD",46,30],["Septo interventricular",42,41],["Cavidad del VI",37,60],["Raíz aórtica",61,36],["Válvula aórtica",57.4,49],["Válvula mitral",53,63],["Aurícula izquierda",65,67],["Pared inferolateral del VI",42,83],["Aorta descendente",70,79]];

  let fig="";
  if(a.img==="plax"){
    const pr=atlasPractice;
    const pins=PLAX_PINS.map((p,i)=>{let cls="pin"; if(pr&&pr.last!=null){ if(i===pr.target&&pr.answered) cls+=" pin-ok"; else if(i===pr.last&&pr.last!==pr.target) cls+=" pin-bad"; }
      return `<button class="${cls}" data-pin="${i}" style="left:${p[1]}%;top:${p[2]}%" aria-label="${pr?"Punto "+(i+1):esc(p[0])}">${i+1}</button>`;}).join("");
    fig=`<figure><div class="paper hot">${'<img src="'+IMG.plax+'" alt="Corte esquemático en eje largo paraesternal">'}${pins}</div><figcaption>Ilustración generada con Gemini; puntos añadidos.</figcaption></figure>
    ${pr?`<div class="callout"><span class="eyebrow">Práctica · ${pr.hits}/${pr.tries}</span><h4>Toca: ${esc(PLAX_PINS[pr.target][0])}</h4>${pr.answered?`<p>${pr.last===pr.target?"<b>Correcto.</b>":"<b>No.</b> Ese punto es "+esc(PLAX_PINS[pr.last][0])+"."}</p><button class="btn" id="pnext">Siguiente</button>`:""}<button class="toggle" id="pstop" style="margin-top:8px">Salir de la práctica</button></div>`:
    `<ul class="legend">${PLAX_PINS.map((p,i)=>`<li><b>${i+1}</b>${esc(p[0])}</li>`).join("")}</ul><button class="btn primary" id="pstart" style="justify-self:start">Practicar: identificar estructuras</button>`}`;
  }
  else if(a.svg==="a4c") fig=`<div class="svgbox lbl-on" id="atl-svg">${SVG_A4C}</div><button class="toggle" data-tgl="atl-svg">Ocultar etiquetas</button>`;
  else if(a.svg==="psax") fig=`<div class="svgbox lbl-on" id="atl-svg">${SVG_PSAX}</div><button class="toggle" data-tgl="atl-svg">Ocultar etiquetas</button>`;
  else if(a.svgRaw) fig=`<div class="svgbox lbl-on" id="atl-svg">${a.svgRaw}</div><button class="toggle" data-tgl="atl-svg">Ocultar etiquetas</button>`;
  app.innerHTML=`<section class="view">
    <div><span class="eyebrow">Atlas</span><h2>Las 12 vistas del estudio estándar</h2></div>
    <figure><div class="paper" style="max-width:520px"><img src="${IMG.ventanas}" alt="Ventanas acústicas: supraesternal, paraesternal, apical y subcostal"></div>
    <figcaption>Ventanas: amarillo supraesternal, rojo paraesternal, azul apical, verde subcostal. Ilustración generada con Gemini.</figcaption></figure>
    <div class="agrid">${grid}</div>
    <article class="lesson"><span class="eyebrow">Ventana ${esc(a.w)}</span><h3>${esc(a.n)}</h3>${fig}
      <dl class="kv"><dt>Marca del transductor</dt><dd>${esc(a.mk)}</dd><dt>Qué ves</dt><dd>${esc(a.see)}</dd><dt>Qué mides</dt><dd>${esc(a.meas)}</dd><dt>Error típico</dt><dd>${esc(a.trap)}</dd></dl>
    </article></section>`;
  app.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{atlasSel=b.dataset.at;atlasPractice=null;render();});
  const ask=()=>{const t=Math.floor(Math.random()*PLAX_PINS.length); atlasPractice=Object.assign(atlasPractice||{hits:0,tries:0},{target:t,last:null,answered:false}); render();};
  const ps=$("#pstart"); if(ps) ps.onclick=ask;
  const pn=$("#pnext"); if(pn) pn.onclick=ask;
  const pst=$("#pstop"); if(pst) pst.onclick=()=>{atlasPractice=null;render();};
  app.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>{const i=+b.dataset.pin; const pr=atlasPractice;
    if(!pr){b.blur();return;} if(pr.answered) return; pr.tries++; pr.last=i; pr.answered=true; if(i===pr.target) pr.hits++; render();});
}
